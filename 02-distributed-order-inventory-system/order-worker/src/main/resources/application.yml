server:
  port: ${SERVER_PORT:8082}   # actuator only
  shutdown: graceful

spring:
  application:
    name: order-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true   # both services may run it; Flyway takes a lock, first one wins
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        concurrency: ${WORKER_CONCURRENCY:4}
        max-concurrency: ${WORKER_MAX_CONCURRENCY:8}
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false   # once retries are exhausted -> dead letter queue
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  lifecycle:
    timeout-per-shutdown-phase: 30s

resilience4j:
  circuitbreaker:
    instances:
      orderDb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.zaalime.orders.worker.OrderRejectedException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
